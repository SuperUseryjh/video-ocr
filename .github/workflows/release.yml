name: Build and publish Windows package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "要发布的标签，必须与 version.py 对应，例如 v0.1.0"
        required: true
        type: string
permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    env:
      STATIC_REPOSITORY: SuperUseryjh/static
      STATIC_PATH: video-ocr
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Validate release version
        shell: pwsh
        run: |
          $version = python -c "from video_ocr.version import __version__; print(__version__)"
          if ("v$version" -ne $env:RELEASE_TAG) { throw "Release tag must equal v$version" }

      - name: Download FFmpeg
        shell: pwsh
        run: |
          Invoke-WebRequest "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip ffmpeg
          $ffmpeg = Get-ChildItem ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          New-Item -ItemType Directory -Force bin | Out-Null
          Copy-Item $ffmpeg.FullName bin/ffmpeg.exe

      - name: Build application package
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onedir --windowed --name VideoOCR --add-binary "bin/ffmpeg.exe;bin" --collect-all rapidocr --collect-all onnxruntime main.py
          New-Item -ItemType Directory -Force package | Out-Null
          Move-Item dist/VideoOCR package/VideoOCR
          Compress-Archive -Path package/VideoOCR -DestinationPath "VideoOCR-windows-x64-$env:RELEASE_TAG.zip"
          $hash = (Get-FileHash "VideoOCR-windows-x64-$env:RELEASE_TAG.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  VideoOCR-windows-x64-$env:RELEASE_TAG.zip" | Set-Content SHA256SUMS.txt -NoNewline
          @{ version = $env:RELEASE_TAG.TrimStart("v"); url = "https://static.yaoonion.fun/$env:STATIC_PATH/VideoOCR-windows-x64-$env:RELEASE_TAG.zip"; sha256 = $hash } | ConvertTo-Json | Set-Content latest.json

      - uses: actions/checkout@v4
        with:
          repository: SuperUseryjh/static
          token: ${{ secrets.STATIC_REPO_PAT }}
          path: static

      - name: Publish static assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "static/$env:STATIC_PATH" | Out-Null
          Copy-Item "VideoOCR-windows-x64-$env:RELEASE_TAG.zip" "static/$env:STATIC_PATH/"
          Copy-Item SHA256SUMS.txt "static/$env:STATIC_PATH/"
          Copy-Item latest.json "static/$env:STATIC_PATH/"
          Set-Location static
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$env:STATIC_PATH"
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "Publish VideoOCR $env:RELEASE_TAG"
          git push
